version: 2
updates:
  # Include both project manifests and indirect packages. Keep the WinGet COM
  # projection and engine together; they must use the same package version.
  - package-ecosystem: nuget
    directories:
      - /
      - /tests
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    allow:
      - dependency-type: all
    assignees: [harder]
    open-pull-requests-limit: 10
    groups:
      terminal-gui:
        patterns: ['Terminal.Gui']
      winget-com:
        patterns: ['Microsoft.WindowsPackageManager.*']
      xunit:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']

  # GitHub Actions — keep workflow action versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees: [harder]
    open-pull-requests-limit: 10

  # Keep the SDK pin visible. SDK PRs also need regenerated NuGet lock files.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    assignees: [harder]
    open-pull-requests-limit: 5
