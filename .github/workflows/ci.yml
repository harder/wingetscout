name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on new pushes to the same branch (saves runner time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Test critical dependency monitor
        run: node --test .github/scripts/critical-dependencies.test.js .github/scripts/ci-command.test.js

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Reject newly vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  linux-runtime-tests:
    name: Linux runtime tests
    needs: workflow-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/WinGetScout.Tests.csproj --locked-mode

      - name: Build cross-platform application
        run: dotnet build WinGetScout.csproj --no-restore --configuration Release --framework net10.0

      - name: Build tests
        run: dotnet build tests/WinGetScout.Tests.csproj --no-restore --no-dependencies --configuration Release

      - name: Test
        run: node .github/scripts/ci-command.js managed-tests dotnet test --project tests/WinGetScout.Tests.csproj --no-build --configuration Release --verbosity normal --minimum-expected-tests 245

      - name: Graceful mock smoke
        run: |
          # The variables below belong to the child bash process.
          # shellcheck disable=SC2016
          node .github/scripts/ci-command.js managed-smoke bash -e -c '
            status=0
            timeout 15s dotnet bin/Release/net10.0/wingetscout.dll --smoke 2> smoke.err || status=$?
            cat smoke.err >&2
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            if [ -s smoke.err ]; then
              echo "::error::Mock run produced stderr output"
              exit 1
            fi
          '

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-diagnostics-linux
          path: obj/ci-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    needs: workflow-lint
    # Windows only — winget itself is Windows-only and Native AOT can't cross-OS publish
    # to win-* targets from Linux. Tests CAN run on Linux but only verify pure-data parser
    # logic, not the full deploy story. Stick to where the real builds happen.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            packages.identity.lock.json
            tests/packages.lock.json

      - name: Compute CI build version
        id: version
        shell: bash
        run: |
          VERSION_PREFIX="$(grep -oPm1 '(?<=<Version>)[^<]+' WinGetScout.csproj)"
          CI_VERSION="${VERSION_PREFIX}-ci.${GITHUB_RUN_NUMBER}+sha.${GITHUB_SHA::7}"
          echo "ci_version=$CI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore tests/WinGetScout.Tests.csproj --locked-mode

      - name: Build cross-platform application
        run: >
          dotnet build WinGetScout.csproj
          --no-restore
          --configuration Release
          --framework net10.0
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      # Compile the WINGET_COM code path on every PR. Running that backend still requires
      # a Windows machine with WinGet available and is outside this compile-only gate.
      - name: Build Windows COM application
        run: >
          dotnet build WinGetScout.csproj
          --no-restore
          --configuration Release
          --framework net10.0-windows10.0.26100.0
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      - name: Build tests
        run: >
          dotnet build tests/WinGetScout.Tests.csproj
          --no-restore
          --no-dependencies
          --configuration Release
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      - name: Test
        run: node .github/scripts/ci-command.js managed-tests dotnet test --project tests/WinGetScout.Tests.csproj --no-build --configuration Release --verbosity normal --minimum-expected-tests 245

      # The app self-stops through its normal shutdown path. The outer deadline is only a
      # deadlock guard; force-kill is failure cleanup, never the successful path.
      - name: Graceful mock smoke
        shell: pwsh
        run: |
          node .github/scripts/ci-command.js managed-smoke pwsh -NoLogo -NoProfile -File .github/scripts/ci-smoke.ps1 -ApplicationPath bin/Release/net10.0/wingetscout.dll
          exit $LASTEXITCODE

      - name: Upload CI build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingetscout-${{ steps.version.outputs.ci_version }}-win-build
          path: |
            bin/Release/net10.0/**
            tests/bin/Release/net10.0/**
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-diagnostics-windows
          path: obj/ci-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7

  native-aot-smoke:
    name: Native AOT ${{ matrix.rid }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            packages.identity.lock.json
            tests/packages.lock.json
      - name: Publish native Windows build
        run: dotnet publish WinGetScout.csproj -c Release -f net10.0-windows10.0.26100.0 -r ${{ matrix.rid }} -p:RestoreLockedMode=true -o publish/${{ matrix.rid }}
      - name: Check packaged COM files and mock startup
        shell: pwsh
        run: |
          $folder = 'publish/${{ matrix.rid }}'
          foreach ($name in @('wingetscout.exe', 'WindowsPackageManager.dll', 'Microsoft.Management.Deployment.InProc.dll')) {
            if (-not (Test-Path (Join-Path $folder $name))) { throw "Missing $name from native publish" }
          }
          node .github/scripts/ci-command.js native-smoke (Join-Path $folder 'wingetscout.exe') --smoke
          if ($LASTEXITCODE -ne 0) { throw "Native mock smoke failed: $LASTEXITCODE" }

      - name: Publish MSIX Identity build with locked dependencies
        run: dotnet publish WinGetScout.csproj -c Release -f net10.0-windows10.0.26100.0 -r ${{ matrix.rid }} -p:WingetComMode=Identity -p:RestoreLockedMode=true -o publish/identity-${{ matrix.rid }}
      - name: Check Identity build metadata and mock startup
        shell: pwsh
        run: |
          $folder = 'publish/identity-${{ matrix.rid }}'
          foreach ($name in @('wingetscout.exe', 'Microsoft.Management.Deployment.winmd')) {
            if (-not (Test-Path (Join-Path $folder $name))) { throw "Missing $name from Identity publish" }
          }
          node .github/scripts/ci-command.js identity-smoke (Join-Path $folder 'wingetscout.exe') --smoke
          if ($LASTEXITCODE -ne 0) { throw "Identity mock smoke failed: $LASTEXITCODE" }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-diagnostics-${{ matrix.rid }}
          path: obj/ci-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7
